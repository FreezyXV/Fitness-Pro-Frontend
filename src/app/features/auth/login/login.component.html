<main class="login-layout">
  <div class="login-main">
    <app-brand />
    <div class="login-form">
      <header>
        <h1>Connexion</h1>
        <p>Retrouve tes séances et suis ta progression.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Adresse email</label>
          <input id="email" formControlName="email" type="email" autocomplete="username"
                 placeholder="prenom@exemple.fr" [attr.aria-invalid]="isFieldInvalid('email')"
                 [attr.aria-describedby]="getFieldError('email') ? 'login-email-error' : null">
          <p class="field-error" id="login-email-error" *ngIf="getFieldError('email') as error">{{ error }}</p>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="password-field">
            <input id="password" formControlName="password" [type]="showPassword ? 'text' : 'password'"
                   autocomplete="current-password" [attr.aria-invalid]="isFieldInvalid('password')"
                   [attr.aria-describedby]="getFieldError('password') ? 'login-password-error' : null">
            <button type="button" class="show-password" (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="20" />
            </button>
          </div>
          <p class="field-error" id="login-password-error" *ngIf="getFieldError('password') as error">{{ error }}</p>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" formControlName="rememberMe"> Se souvenir de moi
          </label>
          <a routerLink="/reset-password">Mot de passe oublié ?</a>
        </div>

        <p class="auth-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
        <button type="submit" class="submit-button" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Connexion en cours…' : 'Se connecter' }}
        </button>
      </form>

      <button type="button" class="guest-button" (click)="onGuestLogin()" [disabled]="isLoading">
        Continuer en tant qu’invité
      </button>
      <p class="register-link">
        Pas encore de compte ?
        <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }">Créer un compte</a>
      </p>
    </div>
  </div>

  <aside class="login-visual" aria-label="Carnet d’entraînement">
    <div class="plate" aria-hidden="true"><span></span></div>
    <div class="visual-copy">
      <p>Le carnet des séances</p>
      <strong>Chaque série<br>compte.</strong>
    </div>
  </aside>
</main>
