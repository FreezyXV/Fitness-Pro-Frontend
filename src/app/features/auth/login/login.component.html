<!-- Enhanced login.component.html -->
<div class="login-wrapper">
  <!-- Floating orbs for enhanced visual appeal -->
  <div class="floating-orb"></div>
  <div class="floating-orb"></div>
  <div class="floating-orb"></div>
  
  <div class="login-card">
    <!-- Enhanced logo section -->
    <div class="logo-section">
      <div class="logo-icon">F</div>
      <h2>Connexion</h2>
      <p class="subtitle">Connectez-vous à votre compte FitnessPro</p>
    </div>

    <!-- Enhanced form with better validation UI -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email field with enhanced styling -->
      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-wrapper">
          <input 
            id="email" 
            formControlName="email" 
            type="email" 
            placeholder="exemple@email.com"
            [class.error]="isFieldInvalid('email')"
            [class.valid]="isFieldValid('email')"
          />
          <app-icon name="mail" class="input-icon"></app-icon>
          <app-icon *ngIf="isFieldValid('email')" name="check"
                    class="validation-icon valid"></app-icon>
        </div>
        <div *ngIf="isFieldInvalid('email')" 
             class="text-error">
          {{ getFieldError('email') }}
        </div>
      </div>

      <!-- Password field with enhanced visibility toggle -->
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input 
            id="password" 
            formControlName="password" 
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Votre mot de passe"
            [class.error]="isFieldInvalid('password')"
            [class.valid]="isFieldValid('password')"
          />
          <app-icon class="input-icon"
                    [name]="showPassword ? 'eye-off' : 'eye'"
                    (click)="togglePasswordVisibility()"
                    style="cursor: pointer;"></app-icon>
        </div>
        <div *ngIf="isFieldInvalid('password')" 
             class="text-error">
          {{ getFieldError('password') }}
        </div>
      </div>

      <!-- Enhanced additional options -->
      <div class="additional-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe" />
          Se souvenir de moi
        </label>
        <a routerLink="/reset-password" class="forgot-password">
          Mot de passe oublié ?
        </a>
      </div>

      <!-- Global error message -->
      <div *ngIf="errorMessage" class="global-error">
        {{ errorMessage }}
      </div>

      <!-- Enhanced submit button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        [class.loading]="isLoading"
        class="submit-btn">
        {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>OU</span>
    </div>

    <!-- Guest login button -->
    <button
      type="button"
      (click)="onGuestLogin()"
      [disabled]="isLoading"
      class="guest-btn">
      <app-icon name="user"></app-icon>
      Continuer en tant qu'invité
    </button>

    <!-- Enhanced navigation link -->
    <div class="text-link">
      Pas encore de compte ?
      <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }">Créer un compte</a>
    </div>
  </div>
</div>
