<!-- Feuille "Plus" : destinations secondaires. Rendue avant la barre pour que
     la barre reste au-dessus dans l'ordre de peinture. -->
<div
  class="sheet-scrim"
  *ngIf="sheetOpen()"
  (click)="closeSheet()"
  aria-hidden="true"
></div>

<div
  class="sheet"
  *ngIf="sheetOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Plus de destinations"
>
  <div class="sheet-grip" aria-hidden="true"></div>

  <nav class="sheet-list" aria-label="Navigation secondaire">
    <a
      *ngFor="let item of secondary"
      [routerLink]="item.route"
      routerLinkActive="is-active"
      class="sheet-link"
    >
      <svg class="sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path *ngFor="let d of item.paths" [attr.d]="d" />
      </svg>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <button type="button" class="sheet-logout" (click)="logout()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <path d="M16 17l5-5-5-5" />
      <path d="M21 12H9" />
    </svg>
    Se déconnecter
  </button>
</div>

<!-- Barre d'onglets. aria-current est pose par routerLinkActive via
     ariaCurrentWhenActive : c'est ce que les lecteurs d'ecran annoncent. -->
<nav class="bottom-nav" aria-label="Navigation principale">
  <a
    *ngFor="let item of primary"
    [routerLink]="item.route"
    routerLinkActive="is-active"
    ariaCurrentWhenActive="page"
    class="tab"
  >
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path *ngFor="let d of item.paths" [attr.d]="d" />
    </svg>
    <span class="tab-label">{{ item.label }}</span>
  </a>

  <button
    type="button"
    class="tab"
    [class.is-active]="sheetOpen() || isSecondaryActive()"
    [attr.aria-expanded]="sheetOpen()"
    aria-haspopup="dialog"
    (click)="toggleSheet()"
  >
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="5" cy="12" r="1.4" />
      <circle cx="12" cy="12" r="1.4" />
      <circle cx="19" cy="12" r="1.4" />
    </svg>
    <span class="tab-label">Plus</span>
  </button>
</nav>
