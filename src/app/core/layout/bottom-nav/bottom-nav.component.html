<nav class="bottom-nav" aria-label="Navigation principale">
  <a *ngFor="let item of primary"
     [routerLink]="item.route" routerLinkActive="is-active" ariaCurrentWhenActive="page"
     class="tab">
    <app-icon [name]="item.icon" [size]="20" />
    <span>{{ item.label }}</span>
  </a>
  <button type="button" class="tab" [class.is-active]="isSecondaryActive()"
          aria-haspopup="dialog" aria-controls="more-destinations"
          [attr.aria-expanded]="sheetOpen()" (click)="openSheet()">
    <app-icon name="more" [size]="20" />
    <span>Plus</span>
  </button>
</nav>

<dialog #sheet class="mobile-nav-sheet" id="more-destinations" aria-labelledby="more-title"
        (close)="sheetOpen.set(false)" (click)="dismissFromBackdrop($event)">
  <div class="sheet-content">
    <header>
      <h2 id="more-title">Plus</h2>
      <button type="button" class="close-button" aria-label="Fermer le menu" autofocus (click)="closeSheet()">
        <app-icon name="close" [size]="22" />
      </button>
    </header>
    <nav class="sheet-list" aria-label="Navigation secondaire">
      <a *ngFor="let item of secondary" [routerLink]="item.route"
         routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeSheet()">
        <app-icon [name]="item.icon" [size]="20" />
        <span>{{ item.label }}</span>
        <span class="chevron" aria-hidden="true">›</span>
      </a>
    </nav>
    <button type="button" class="sheet-logout" (click)="logout()">
      <app-icon name="logout" [size]="20" /> Se déconnecter
    </button>
  </div>
</dialog>
