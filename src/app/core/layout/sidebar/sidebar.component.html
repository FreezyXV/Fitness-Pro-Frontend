<a class="sidebar-brand" routerLink="/dashboard" aria-label="FitnessPro, accueil"><app-brand /></a>

<nav class="sidebar-nav" aria-label="Navigation principale">
  <div class="nav-section" *ngFor="let section of sections">
    <p>{{ section.label }}</p>
    <a *ngFor="let item of section.items"
       [routerLink]="item.route" routerLinkActive="active" ariaCurrentWhenActive="page">
      <app-icon [name]="item.icon" [size]="19" />
      <span>{{ item.label }}</span>
    </a>
  </div>
</nav>

<div class="account">
  <a class="profile" routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">
    <span class="avatar"><app-icon name="user" [size]="18" /></span>
    <span class="profile-text">
      <strong>{{ (user | async)?.name || 'Mon profil' }}</strong>
      <small>Mon profil</small>
    </span>
  </a>
  <button type="button" class="logout" (click)="logout()" aria-label="Se déconnecter" title="Se déconnecter">
    <app-icon name="logout" [size]="19" />
  </button>
</div>
